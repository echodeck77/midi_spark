name: MidiSpark
options:
  bundleIdPrefix: com.paulbarrett
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  Atomics:
    url: https://github.com/apple/swift-atomics
    from: 1.2.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"      # iPad
    DEVELOPMENT_TEAM: U9LCUSTWSQ     # signing survives `xcodegen generate` (which rewrites the .xcodeproj)
    CODE_SIGN_STYLE: Automatic
  # FOURFOLD (Step 3): what BOTH Fourfold targets compile — the engine + Fourfold UI sources (AUExtension minus the 8x8 workbench) and Fourfold/Shared. The AU extension adds Fourfold/AU; the app adds Fourfold/App.
  # A new AUExtension/*.swift file is compiled into BOTH products unless it is added to the excludes below (and Scripts/fourfold-harness reads this list too).
targetTemplates:
  FourfoldEngine:
    # FOURFOLD (Step 4): everything both Fourfold targets compile lives under Fourfold/ — NOTHING from AUExtension/ (8x8 State's frozen sources). The AU extension adds Fourfold/AU; the app adds Fourfold/App.
    sources:
      - path: Fourfold/Engine    # the engine copy + Fourfold-owned logic (Foundation-only files here are also the FourfoldTests target's sources)
      - path: Fourfold/UI        # the Fourfold page and its painters
      - path: Fourfold/Shared    # the root view, reel browser, telemetry, transport clock
    dependencies:
      - package: Atomics
        product: Atomics
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FOURFOLD"
        # ONE version for the app AND its embedded AU extension (App Store validation wants them to agree): MARKETING_VERSION is the user-visible version, CURRENT_PROJECT_VERSION the build
        # number that must go up on every upload. Both plists read these two (`$(MARKETING_VERSION)`); `sh Scripts/bump-build.sh` raises the build number.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
targets:
  MidiSpark:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        # Public/display branding is "8x8 State" (display-only); the target, bundle IDs, product
        # name, and the aumi component codes all stay MidiSpark. AppIcon set lives in App/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "8x8 State"
        # Must match AUExtension/Info.plist's CFBundleShortVersionString — an app extension
        # whose version differs from its container fails embedded-binary validation.
        # The extension plist is hand-maintained, so bump BOTH together.
        CFBundleShortVersionString: "0.1.0"
        # ALL ORIENTATIONS (Paul 2026-09-03): Apple is about to IGNORE UIRequiresFullScreen and REQUIRE support for all
        # orientations, so we declare all four and drop UIRequiresFullScreen (its two deprecation warnings clear). The AUv3
        # view in a host like AUM is sized by the HOST (orientation here is moot for the plugin); the container app is only a
        # minimal shell/standalone stub, and the in-plugin UI is responsive (buildPage adapts portrait/landscape). These live
        # HERE, not in App/Info.plist — XcodeGen regenerates that file from these properties, so a direct edit is clobbered.
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: MidiSparkAU
        embed: true
  MidiSparkAU:
    type: app-extension
    platform: iOS
    sources:
      - path: AUExtension
        excludes: ["Info.plist"]     # plist is hand-maintained; never let it into Compile/Copy phases
      - path: Docs/manual/manual-skeleton.md   # IN-APP MANUAL: bundled as a resource, loaded by ManualView (the "?" button)
        buildPhase: resources
    dependencies:
      - package: Atomics
        product: Atomics
    # NOTE: no `info:` block here — XcodeGen would REGENERATE (i.e. destroy) the handcrafted
    # plist that declares the aumi audio component. The file is referenced via INFOPLIST_FILE only.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulbarrett.MidiSpark.AU
        INFOPLIST_FILE: AUExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO

  # FOURFOLD (2026-10-23, Docs/standalone-plan.md Step 1c): the standalone Fourfold app + AUv3. Same engine/UI sources as MidiSparkAU (target membership) minus the 8x8 workbench; Step 4 copies the engine.
  Fourfold:
    type: application
    platform: iOS
    deploymentTarget: "15.0"   # FOURFOLD floor (2026-10-24): iOS 15 is the oldest SwiftUI Canvas / TimelineView / GraphicsContext allow — the painters are the page. Musicians' iPads sit on old iPadOS; 8x8 State stays at the project default (16).
    templates: [FourfoldEngine]
    sources: [Fourfold/App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.outliermidi.Fourfold
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # Fourfold/App/Assets.xcassets (the Canon icon, Design/Brand/); separate from MidiSpark's App/Assets.xcassets. XcodeGen also defaults it; explicit so it cannot vanish
        # ABLETON LINK — OFF UNTIL AFTER RELEASE (Paul, 2026-10-24). Every line marked `#LINK ` below is the Link wiring, commented out;
        # `sh Scripts/link-switch.sh on` un-comments them (and fetches LinkKit), `… off` puts them back. The Swift side is behind `#if FOURFOLD_LINK`.
        # (2026-10-24 ferry): LinkKit is a pure-C SDK with no Swift module, so every integration (including Ableton's own LinkHut sample) uses a bridging
        # header. `-lc++` is required because Link's own implementation is C++ (per LinkKit's own integration notes), even though nothing in this app writes
        # C++ directly. Scoped to the Fourfold APP target only — FourfoldAU/FourfoldEngine/FourfoldTests do not get Link (confirmed scope: standalone app only).
        # LINK-BEGIN
#LINK         SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FOURFOLD FOURFOLD_LINK"
#LINK         SWIFT_OBJC_BRIDGING_HEADER: Fourfold/App/Fourfold-Bridging-Header.h
#LINK         OTHER_LDFLAGS: "$(inherited) -lc++"
        # LINK-END
    info:
      path: Fourfold/App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "Fourfold"
        # Version + build come from MARKETING_VERSION / CURRENT_PROJECT_VERSION above (the AU's hand-maintained plist reads the same two), so the app and the extension cannot disagree.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # RELEASE SETTINGS (2026-10-24): the app uses no encryption beyond what the OS provides (answers export compliance on every upload) · Music category in the App Store ·
        # the Documents folder is visible in the Files app (presets, reel MIDI exports) · Bluetooth MIDI pairing (the screen is in the transport bar; CoreMIDI needs this string to scan).
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.music
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSBluetoothAlwaysUsageDescription: "Fourfold uses Bluetooth to connect Bluetooth MIDI keyboards and controllers."
        # STANDALONE (Step 3): a silent audio engine is the app's render thread and keeps it running in the background (FourfoldEngine); CoreMIDI needs no permission on iOS.
        UIBackgroundModes: [audio]
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # ABLETON LINK (OFF until after release — see above): Link discovers peers over local-network UDP multicast — iOS requires a usage description for that,
        # plus the ABLLink*Supported keys that make the corresponding toggles appear in Ableton's own ABLLinkSettingsViewController (there is no programmatic setter
        # for "start/stop sync enabled"; only that view can turn it on — §ABLLink.h). With Link off the app asks for NO local-network permission.
        # LINK-BEGIN
#LINK         NSLocalNetworkUsageDescription: "Fourfold uses the local network to sync tempo and transport with other Ableton Link apps."
#LINK         ABLLinkStartStopSyncSupported: true
#LINK         ABLLinkPeerName: "Fourfold"
        # LINK-END
    # ABLETON LINK (OFF until after release): the RESTRICTED multicast entitlement — Apple must approve it per App ID (developer.apple.com, requested by Paul; cannot be
    # done from here). Builds/Simulator runs work without approval; real-device peer discovery does not until it's granted. With Link off the app carries NO
    # restricted entitlement, so a device / TestFlight build does not depend on that approval. See Docs/euclideous-device-verification-debt.md.
    # LINK-BEGIN
#LINK     entitlements:
#LINK       path: Fourfold/App/Fourfold.entitlements
#LINK       properties:
#LINK         com.apple.developer.networking.multicast: true
    # LINK-END
    dependencies:
      - target: FourfoldAU
        embed: true
      # LINK-BEGIN
#LINK       - framework: Fourfold/Vendor/LinkKit.xcframework
#LINK         embed: false   # static library (libLinkKit.a per slice) — nothing to embed at runtime
      # LINK-END
  FourfoldAU:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"   # FOURFOLD floor (2026-10-24): iOS 15 is the oldest SwiftUI Canvas / TimelineView / GraphicsContext allow — the painters are the page. Musicians' iPads sit on old iPadOS; 8x8 State stays at the project default (16).
    templates: [FourfoldEngine]
    sources:
      - path: Fourfold/AU
        excludes: ["Info.plist"]     # hand-maintained, like MidiSparkAU's: never let XcodeGen generate it (it would drop the aumi AudioComponents)
    # NOTE: no `info:` block here, for the same reason as MidiSparkAU.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.outliermidi.Fourfold.AU
        INFOPLIST_FILE: Fourfold/AU/Info.plist
        GENERATE_INFOPLIST_FILE: NO

  # Off-device unit tests for the pure engine core. macOS + host-less logic bundle → runs in
  # seconds with `xcodebuild test`, no simulator. Compiles the pure sources directly (they are
  # Foundation-only), so it does not link the iOS extension.
  MidiSparkTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - Tests
      - path: AUExtension/Derivations.swift
      - path: AUExtension/EuclideousRandom.swift   # RANDOM MODE ferry: throw/tweak pure functions + landing/undo-sequence builder (Foundation-only)
      - path: AUExtension/EuclideousLock.swift     # LANE LOCK ferry: grid lines, lock fields, snap decision, control-change list, layouts, undo rules (Foundation-only)
      - path: AUExtension/MacroAuthoring.swift   # macro authoring flow — the pure control-group registry + logic
      - path: AUExtension/Models.swift
      - path: AUExtension/Snapshot.swift    # pure now (store split out) → effective-param tests
      - path: AUExtension/SnapshotBuilder.swift   # document → snapshot resolution
      - path: AUExtension/SceneFactory.swift       # the 16 factory scenes (Foundation-only)
      - path: AUExtension/Emission.swift    # MIDIEmitter seam — tests inject a recording double + THE REEL-TO-REEL (ReelDeck)
      - path: AUExtension/MidiFile.swift    # SMF encoder — REEL-TO-REEL export (step 2), pure + unit-tested
      - path: AUExtension/Diag.swift        # KernelDiag (moved out of Kernel so Router is pure)
      - path: AUExtension/Router.swift      # the render engine — now Foundation-only, unit-testable
      - path: AUExtension/PresetStore.swift  # PRESETS v1 — name sanitize + document round-trip (pure surface)
      - path: AUExtension/CellLibraryStore.swift  # the 8x8 cell library + LibEntry (split out of PresetStore.swift 2026-10-23, Fourfold Step 1a)
      - path: Fourfold/Engine/FourfoldCompose.swift   # FOURFOLD Step 1b: the Fourfold-only scene composer (Foundation-only)
      - path: AUExtension/Dice.swift         # THE DICE — chain generation + offline (Router-based) evaluation
      - path: AUExtension/EuclideousPresets.swift   # the 20 factory presets (Foundation-only) — the MIX ferry's preset-stream regression test renders them
      - path: AUExtension/BuildSelfTest.swift # in-app MIDI-output self-tests — validated off-device by the meta-test
      - path: AUExtension/BuildSceneLogic.swift # pure BUILD scene composition + staging reconcile — unit-tested
      - path: AUExtension/BuildModel.swift    # BuildPart + BuildUnassignedData — the persisted workshop types
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.paulbarrett.MidiSparkTests
        CODE_SIGNING_ALLOWED: NO

  # FOURFOLD's own off-device tests (Step 4): macOS, host-less, compiles Fourfold's engine COPY (Fourfold/Engine) — never the 8x8 originals. `Scripts/run-fourfold-tests.sh`.
  FourfoldTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - Fourfold/Tests
      - path: Fourfold/Engine/Derivations.swift
      - path: Fourfold/Engine/Models.swift
      - path: Fourfold/Engine/Snapshot.swift
      - path: Fourfold/Engine/SnapshotBuilder.swift
      - path: Fourfold/Engine/Emission.swift
      - path: Fourfold/Engine/MidiFile.swift
      - path: Fourfold/Engine/Diag.swift
      - path: Fourfold/Engine/Router.swift
      - path: Fourfold/Engine/PresetStore.swift
      - path: Fourfold/Engine/BuildModel.swift
      - path: Fourfold/Engine/EuclideousRandom.swift
      - path: Fourfold/Engine/EuclideousLock.swift
      - path: Fourfold/Engine/EuclideousPresets.swift
      - path: Fourfold/Engine/FourfoldCompose.swift
      - path: Fourfold/Engine/SessionTape.swift
      - path: Fourfold/Shared/FourfoldTransportClock.swift
    dependencies:
      - package: Atomics
        product: Atomics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.outliermidi.FourfoldTests
        CODE_SIGNING_ALLOWED: NO

# Shared schemes (written to xcshareddata → tracked, always present). Without this, XcodeGen
# generates no scheme and Xcode's auto-created ones live in xcuserdata — which is gitignored and
# was deleted, so the app scheme vanished. Run MidiSpark (the app); it embeds + registers the AU.
  # UI tests of the REAL standalone app in the simulator (Scripts/fourfold-harness/screenshots.sh): rotate the iPad, attach screenshots. No product code reaches this target.
  FourfoldUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"   # FOURFOLD floor (2026-10-24): iOS 15 is the oldest SwiftUI Canvas / TimelineView / GraphicsContext allow — the painters are the page. Musicians' iPads sit on old iPadOS; 8x8 State stays at the project default (16).
    sources:
      - Fourfold/UITests
    dependencies:
      - target: Fourfold
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.outliermidi.FourfoldUITests
        TEST_TARGET_NAME: Fourfold
        CODE_SIGNING_ALLOWED: NO

schemes:
  MidiSpark:
    build:
      targets:
        MidiSpark: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Fourfold:
    build:
      targets:
        Fourfold: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  MidiSparkTests:
    build:
      targets:
        MidiSparkTests: [test]
    test:
      config: Debug
      targets:
        - MidiSparkTests
  FourfoldTests:
    build:
      targets:
        FourfoldTests: [test]
    test:
      config: Debug
      targets:
        - FourfoldTests
  FourfoldUITests:
    build:
      targets:
        Fourfold: all
        FourfoldUITests: [test]
    test:
      config: Debug
      targets:
        - FourfoldUITests
