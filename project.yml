name: MidiSpark
options:
  bundleIdPrefix: com.paulbarrett
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  Atomics:
    url: https://github.com/apple/swift-atomics
    from: 1.2.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"      # iPad
    DEVELOPMENT_TEAM: U9LCUSTWSQ     # signing survives `xcodegen generate` (which rewrites the .xcodeproj)
    CODE_SIGN_STYLE: Automatic
  # FOURFOLD (Step 3): what BOTH Fourfold targets compile — the engine + Fourfold UI sources (AUExtension minus the 8x8 workbench) and Fourfold/Shared. The AU extension adds Fourfold/AU; the app adds Fourfold/App.
  # A new AUExtension/*.swift file is compiled into BOTH products unless it is added to the excludes below (and Scripts/fourfold-harness reads this list too).
targetTemplates:
  FourfoldEngine:
    sources:
      - path: AUExtension
        excludes: ["Info.plist", "ArrangementBar.swift", "AudioUnitViewController.swift", "AutoPilot.swift", "BuildGridSelector.swift", "BuildPage.swift", "BuildReel.swift", "BuildSelfTest.swift", "ChaosDriver.swift", "CogPage.swift", "DragDropPage.swift", "EditPage.swift", "GridSkin.swift", "GridUI.swift", "ManualView.swift", "RackMatrix.swift", "RoomsPage.swift", "MacroAuthoring.swift", "SceneFactory.swift", "BuildSceneLogic.swift", "Dice.swift", "CellLibraryStore.swift", "CellBrowser.swift", "MidiSparkAudioUnit+CellLibrary.swift", "TestSessions.swift", "Router.swift", "Derivations.swift", "Models.swift", "Kernel.swift", "Snapshot.swift", "SnapshotBuilder.swift", "SnapshotStore.swift", "Emission.swift", "Diag.swift", "MidiSparkAudioUnit.swift", "MidiFile.swift", "PresetStore.swift", "BuildModel.swift"]
      - path: Fourfold/Engine    # FOURFOLD'S OWN COPY of the engine (Step 4): the originals in AUExtension/ are excluded above and stay frozen for 8x8 State
      - path: Fourfold/Shared    # the Fourfold root view, reel browser, telemetry, transport clock
    dependencies:
      - package: Atomics
        product: Atomics
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FOURFOLD"
targets:
  MidiSpark:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        # Public/display branding is "8x8 State" (display-only); the target, bundle IDs, product
        # name, and the aumi component codes all stay MidiSpark. AppIcon set lives in App/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "8x8 State"
        # Must match AUExtension/Info.plist's CFBundleShortVersionString — an app extension
        # whose version differs from its container fails embedded-binary validation.
        # The extension plist is hand-maintained, so bump BOTH together.
        CFBundleShortVersionString: "0.1.0"
        # ALL ORIENTATIONS (Paul 2026-09-03): Apple is about to IGNORE UIRequiresFullScreen and REQUIRE support for all
        # orientations, so we declare all four and drop UIRequiresFullScreen (its two deprecation warnings clear). The AUv3
        # view in a host like AUM is sized by the HOST (orientation here is moot for the plugin); the container app is only a
        # minimal shell/standalone stub, and the in-plugin UI is responsive (buildPage adapts portrait/landscape). These live
        # HERE, not in App/Info.plist — XcodeGen regenerates that file from these properties, so a direct edit is clobbered.
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: MidiSparkAU
        embed: true
  MidiSparkAU:
    type: app-extension
    platform: iOS
    sources:
      - path: AUExtension
        excludes: ["Info.plist"]     # plist is hand-maintained; never let it into Compile/Copy phases
      - path: Docs/manual/manual-skeleton.md   # IN-APP MANUAL: bundled as a resource, loaded by ManualView (the "?" button)
        buildPhase: resources
    dependencies:
      - package: Atomics
        product: Atomics
    # NOTE: no `info:` block here — XcodeGen would REGENERATE (i.e. destroy) the handcrafted
    # plist that declares the aumi audio component. The file is referenced via INFOPLIST_FILE only.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulbarrett.MidiSpark.AU
        INFOPLIST_FILE: AUExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO

  # FOURFOLD (2026-10-23, Docs/standalone-plan.md Step 1c): the standalone Fourfold app + AUv3. Same engine/UI sources as MidiSparkAU (target membership) minus the 8x8 workbench; Step 4 copies the engine.
  Fourfold:
    type: application
    platform: iOS
    templates: [FourfoldEngine]
    sources: [Fourfold/App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulbarrett.Fourfold
    info:
      path: Fourfold/App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "Fourfold"
        # Must match Fourfold/AU/Info.plist's CFBundleShortVersionString (embedded-binary validation); that plist is hand-maintained, so bump BOTH together.
        CFBundleShortVersionString: "0.1.0"
        # STANDALONE (Step 3): a silent audio engine is the app's render thread and keeps it running in the background (FourfoldEngine); CoreMIDI needs no permission on iOS.
        UIBackgroundModes: [audio]
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: FourfoldAU
        embed: true
  FourfoldAU:
    type: app-extension
    platform: iOS
    templates: [FourfoldEngine]
    sources:
      - path: Fourfold/AU
        excludes: ["Info.plist"]     # hand-maintained, like MidiSparkAU's: never let XcodeGen generate it (it would drop the aumi AudioComponents)
    # NOTE: no `info:` block here, for the same reason as MidiSparkAU.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulbarrett.Fourfold.AU
        INFOPLIST_FILE: Fourfold/AU/Info.plist
        GENERATE_INFOPLIST_FILE: NO

  # Off-device unit tests for the pure engine core. macOS + host-less logic bundle → runs in
  # seconds with `xcodebuild test`, no simulator. Compiles the pure sources directly (they are
  # Foundation-only), so it does not link the iOS extension.
  MidiSparkTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - Tests
      - path: AUExtension/Derivations.swift
      - path: AUExtension/EuclideousRandom.swift   # RANDOM MODE ferry: throw/tweak pure functions + landing/undo-sequence builder (Foundation-only)
      - path: AUExtension/EuclideousLock.swift     # LANE LOCK ferry: grid lines, lock fields, snap decision, control-change list, layouts, undo rules (Foundation-only)
      - path: AUExtension/MacroAuthoring.swift   # macro authoring flow — the pure control-group registry + logic
      - path: AUExtension/Models.swift
      - path: AUExtension/Snapshot.swift    # pure now (store split out) → effective-param tests
      - path: AUExtension/SnapshotBuilder.swift   # document → snapshot resolution
      - path: AUExtension/SceneFactory.swift       # the 16 factory scenes (Foundation-only)
      - path: AUExtension/Emission.swift    # MIDIEmitter seam — tests inject a recording double + THE REEL-TO-REEL (ReelDeck)
      - path: AUExtension/MidiFile.swift    # SMF encoder — REEL-TO-REEL export (step 2), pure + unit-tested
      - path: AUExtension/Diag.swift        # KernelDiag (moved out of Kernel so Router is pure)
      - path: AUExtension/Router.swift      # the render engine — now Foundation-only, unit-testable
      - path: AUExtension/PresetStore.swift  # PRESETS v1 — name sanitize + document round-trip (pure surface)
      - path: AUExtension/CellLibraryStore.swift  # the 8x8 cell library + LibEntry (split out of PresetStore.swift 2026-10-23, Fourfold Step 1a)
      - path: AUExtension/FourfoldCompose.swift   # FOURFOLD Step 1b: the Fourfold-only scene composer (Foundation-only)
      - path: Fourfold/Shared/FourfoldTransportClock.swift   # FOURFOLD Step 3: the standalone app's internal transport + the CoreMIDI host-time stamp (Foundation-only)
      - path: AUExtension/Dice.swift         # THE DICE — chain generation + offline (Router-based) evaluation
      - path: AUExtension/EuclideousPresets.swift   # the 20 factory presets (Foundation-only) — the MIX ferry's preset-stream regression test renders them
      - path: AUExtension/BuildSelfTest.swift # in-app MIDI-output self-tests — validated off-device by the meta-test
      - path: AUExtension/BuildSceneLogic.swift # pure BUILD scene composition + staging reconcile — unit-tested
      - path: AUExtension/BuildModel.swift    # BuildPart + BuildUnassignedData — the persisted workshop types
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.paulbarrett.MidiSparkTests
        CODE_SIGNING_ALLOWED: NO

# Shared schemes (written to xcshareddata → tracked, always present). Without this, XcodeGen
# generates no scheme and Xcode's auto-created ones live in xcuserdata — which is gitignored and
# was deleted, so the app scheme vanished. Run MidiSpark (the app); it embeds + registers the AU.
schemes:
  MidiSpark:
    build:
      targets:
        MidiSpark: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Fourfold:
    build:
      targets:
        Fourfold: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  MidiSparkTests:
    build:
      targets:
        MidiSparkTests: [test]
    test:
      config: Debug
      targets:
        - MidiSparkTests